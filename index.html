<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI 시안</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px;
      background: #fff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    ul {
      width: min(100%, 360px);
      margin: 0;
      padding: 0;
      border-top: 1px solid #ddd;
      list-style: none;
    }

    a {
      display: block;
      padding: 16px 4px;
      border-bottom: 1px solid #ddd;
      color: inherit;
      font-size: 18px;
      text-decoration: none;
    }

    a:hover { background: #f5f5f5; }

    @media (max-width: 520px) {
      body { padding: 24px; }
      ul { width: 100%; }
    }
  </style>
</head>
<body>

    <li><a href="v1/index.html">v1</a></li>
    <li><a href="v2/index.html">v2</a></li>

  </ul>
</body>
</html>
