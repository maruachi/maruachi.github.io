<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="EDC WORLD v9 — 데스크탑·모바일 커뮤니티 및 관리자 화면 시안">
  <title>EDC WORLD · v9 Design Board</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
  <script src="ui.js" defer></script>
</head>
<body>
  <header class="studio-header">
    <a class="studio-brand" href="#home">EDC WORLD <span>v9</span></a>
    <span class="studio-description">COMMUNITY / DESIGN BOARD</span>
    <div class="view-controls" aria-label="시안 배율">
      <button data-zoom="-" aria-label="축소">−</button><output id="zoom-value">75%</output><button data-zoom="+" aria-label="확대">＋</button><button id="fit">맞춤</button>
    </div>
  </header>
  <aside class="studio-sidebar">
    <p class="eyebrow">ESSENTIAL SCREENS <span>05</span></p>
    <nav id="screen-nav" aria-label="시안 화면"></nav>
    <div class="design-note"><p class="eyebrow">DESIGN DIRECTION</p><h2>좋은 도구,<br>좋은 사람들.</h2><p>발견하고, 읽고, 나누는 커뮤니티.<br>그 흐름을 지키는 운영 화면까지.</p><div class="swatches"><i></i><i></i><i></i></div><small>Paper · Olive · Orange</small></div>
    <p class="sidebar-footer">EDC WORLD / SEPTEMBER 2026<br>인터랙티브 시안 · 예시 콘텐츠</p>
  </aside>
  <main class="workspace">
    <header class="board-heading"><div><p class="eyebrow" id="screen-number"></p><h1 id="screen-title"></h1><p id="screen-description"></p></div><span class="board-badge">DESKTOP + MOBILE</span></header>
    <div class="board-scroll"><div id="artboards"></div></div>
    <p class="workspace-note">두 화면은 같은 콘텐츠를 공유합니다. 글·댓글 등록과 관리자 처리는 현재 탭에서만 유지되며 새로고침하면 초기화됩니다.</p>
  </main>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
